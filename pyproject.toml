[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitgenesis"
version = "0.0.1"
description = "An artificial-life research world built from simple rules"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.scripts]
bitgenesis = "bitgenesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
