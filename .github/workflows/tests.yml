name: V0 contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Verify invariants and frozen replay
        run: python -m unittest discover -s tests -v
      - name: Verify original scaffold
        run: python -m bitgenesis v0 --config experiments/v0/empty-world.toml
      - name: Verify installed Darwin CLI
        run: bitgenesis v0 --config experiments/v0/darwin-baseline.toml --steps 10 --output data/ci-smoke
