name: V0 contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Verify invariants and frozen replay
        run: python -m unittest discover -s tests -v
      - name: Verify tracked campaign workload inventory
        run: python scripts/check_v0_campaign_inventory.py
      - name: Verify original scaffold
        run: python -m bitgenesis v0 --config experiments/v0/empty-world.toml
      - name: Verify installed Darwin CLI
        run: bitgenesis v0 --config experiments/v0/darwin-baseline.toml --steps 10 --output data/ci-smoke
      - name: Audit saved run independently
        run: bitgenesis audit data/ci-smoke
